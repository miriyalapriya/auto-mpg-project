<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Predicting Car Fuel Efficiency</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <style>
    :root { --ink: #0f172a; --muted: #64748b; --line: #e2e8f0; --bg: #f1f5f9; --card: #ffffff; --accent: #4f46e5; --accent2: #0ea5e9; --soft: #eef2ff; }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; line-height: 1.7; color: var(--ink); background: var(--bg); }
    .wrap { max-width: 900px; margin: 0 auto; padding: 20px 18px 70px; }
    a { color: var(--accent); }
    ul, ol { padding-left: 22px; }
    li { margin-bottom: 4px; }

    /* hero */
    .hero { background: linear-gradient(135deg, #0f172a 0%, #312e81 55%, #0ea5e9 130%); color: #ffffff; border-radius: 22px; padding: 40px 34px 30px; position: relative; overflow: hidden; }
    .hero::after { content: ""; position: absolute; right: -80px; top: -80px; width: 280px; height: 280px; border-radius: 50%; background: rgba(255,255,255,0.07); }
    .hero-top { display: flex; flex-wrap: wrap; align-items: center; gap: 20px; justify-content: space-between; position: relative; z-index: 1; }
    .hero-text { flex: 1 1 360px; }
    .tag { display: inline-block; font-size: 0.78rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; background: rgba(255,255,255,0.14); padding: 4px 12px; border-radius: 20px; margin-bottom: 14px; }
    .hero h1 { font-size: 2.15rem; line-height: 1.2; margin: 0 0 10px; font-weight: 800; }
    .hero .subtitle { margin: 0; color: #c7d2fe; }
    .hero svg { flex: 0 1 280px; max-width: 100%; height: auto; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin-top: 26px; position: relative; z-index: 1; }
    .stat { background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.18); border-radius: 14px; padding: 14px 16px; }
    .stat b { display: block; font-size: 1.7rem; line-height: 1.2; font-weight: 800; }
    .stat span { font-size: 0.82rem; color: #c7d2fe; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 22px; position: relative; z-index: 1; }
    .chips a { text-decoration: none; font-size: 0.84rem; font-weight: 600; color: #ffffff; background: rgba(255,255,255,0.14); border: 1px solid rgba(255,255,255,0.25); padding: 6px 14px; border-radius: 20px; }
    .chips a:hover { background: #ffffff; color: #312e81; }

    /* menu */
    #nav { position: sticky; top: 8px; z-index: 20; display: flex; gap: 6px; overflow-x: auto; white-space: nowrap; background: rgba(255,255,255,0.92); backdrop-filter: blur(8px); padding: 9px 10px; border: 1px solid var(--line); border-radius: 14px; margin: 14px 0 6px; box-shadow: 0 4px 14px rgba(15,23,42,0.08); }
    #nav a { text-decoration: none; font-size: 0.82rem; font-weight: 600; padding: 6px 12px; border-radius: 16px; color: #334155; background: #f8fafc; border: 1px solid var(--line); }
    #nav a:hover { background: var(--soft); border-color: var(--accent); color: var(--accent); }

    /* sections as cards */
    section { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 26px 28px; margin-top: 20px; box-shadow: 0 2px 10px rgba(15,23,42,0.04); scroll-margin-top: 70px; }
    h2 { margin: 0 0 12px; font-size: 1.35rem; font-weight: 700; padding-left: 14px; border-left: 5px solid var(--accent); line-height: 1.3; }
    h3 { font-size: 1rem; margin: 22px 0 6px; color: #334155; }
    .callout { background: var(--soft); border-left: 4px solid var(--accent); border-radius: 0 10px 10px 0; padding: 10px 16px; margin: 14px 0; }

    /* tables */
    .tablewrap { overflow-x: auto; margin: 10px 0 14px; border: 1px solid var(--line); border-radius: 12px; }
    table { border-collapse: collapse; width: 100%; font-size: 0.9rem; }
    th, td { padding: 9px 12px; text-align: left; border-bottom: 1px solid var(--line); }
    th { background: #f8fafc; font-weight: 600; color: #334155; white-space: nowrap; }
    tr:last-child td { border-bottom: none; }
    tr.final td { background: var(--soft); font-weight: 700; color: #3730a3; }
    img { max-width: 100%; height: auto; border: 1px solid var(--line); border-radius: 12px; }

    /* predictor */
    #predictor { background: linear-gradient(180deg, #f8fafc, #eef2ff); border: 1px solid #c7d2fe; border-radius: 18px; padding: 22px; margin-top: 14px; }
    .presets { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
    .presets button { font-family: inherit; font-size: 0.85rem; font-weight: 600; padding: 8px 14px; border: 1px solid #c7d2fe; background: #ffffff; color: #3730a3; border-radius: 20px; cursor: pointer; }
    .presets button:hover { background: var(--accent); color: #ffffff; border-color: var(--accent); }
    .controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px 28px; margin-top: 10px; }
    .ctl label { display: flex; justify-content: space-between; font-weight: 600; font-size: 0.88rem; margin-bottom: 4px; color: #334155; }
    .ctl .val { color: var(--accent); font-variant-numeric: tabular-nums; }
    .ctl input[type=range] { width: 100%; accent-color: var(--accent); }
    .ctl select { width: 100%; font-family: inherit; padding: 8px; font-size: 0.95rem; border: 1px solid #c7d2fe; border-radius: 10px; background: #ffffff; }
